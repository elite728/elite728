<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Sergio  Senior Full-Stack Engineer</title>
  <desc id="desc">Dark product-style banner with architecture and design system cues</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="100%" stop-color="#121821"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C9CFF"/>
      <stop offset="50%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2230" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#141A24" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="418" rx="27" fill="none" stroke="#243044" stroke-width="2"/>

  <circle cx="1080" cy="70" r="160" fill="#7C9CFF" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1180" cy="320" r="140" fill="#5EEAD4" opacity="0.07" filter="url(#glow)"/>

  <text x="56" y="58" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="13" letter-spacing="3.2" fill="#8BA0B8">PRODUCT ENGINEER · SYSTEMS · INTERFACE</text>
  <text x="56" y="118" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="42" font-weight="700" fill="#F4F7FB">Sergio</text>
  <text x="56" y="162" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="20" fill="#C9D4E3">Senior Full-Stack Engineer  ·  AI / LLM Expert  ·  Python, JS/TS</text>
  <rect x="56" y="184" width="220" height="3" rx="2" fill="url(#accent)"/>
  <text x="56" y="228" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="15" fill="#9AAEBF">I ship production systems with the same rigor I bring to the interface:</text>
  <text x="56" y="252" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="15" fill="#9AAEBF">clear architecture, measurable quality, and UI that feels intentional.</text>

  <!-- Floating product cards -->
  <g transform="translate(780,48)">
    <rect width="440" height="324" rx="20" fill="url(#card)" stroke="#2A3648"/>
    <rect x="20" y="20" width="72" height="10" rx="5" fill="#2E3B50"/>
    <rect x="100" y="20" width="40" height="10" rx="5" fill="#2E3B50"/>
    <circle cx="400" cy="25" r="6" fill="#5EEAD4"/>
    <circle cx="418" cy="25" r="6" fill="#7C9CFF"/>

    <rect x="20" y="52" width="184" height="112" rx="14" fill="#10151D" stroke="#2A3648"/>
    <text x="36" y="80" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="11" fill="#7A8CA0">LATENCY P95</text>
    <text x="36" y="112" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#F4F7FB">142ms</text>
    <text x="36" y="140" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12" fill="#5EEAD4">38% after tracing</text>

    <rect x="216" y="52" width="204" height="112" rx="14" fill="#10151D" stroke="#2A3648"/>
    <text x="232" y="80" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="11" fill="#7A8CA0">LLM EVAL PASS</text>
    <text x="232" y="112" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#F4F7FB">94.2%</text>
    <text x="232" y="140" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12" fill="#C4B5FD">grounded + judged</text>

    <rect x="20" y="180" width="400" height="120" rx="14" fill="#10151D" stroke="#2A3648"/>
    <text x="36" y="208" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="11" fill="#7A8CA0">DESIGN TOKENS</text>
    <rect x="36" y="226" width="48" height="48" rx="10" fill="#7C9CFF"/>
    <rect x="92" y="226" width="48" height="48" rx="10" fill="#5EEAD4"/>
    <rect x="148" y="226" width="48" height="48" rx="10" fill="#C4B5FD"/>
    <rect x="204" y="226" width="48" height="48" rx="10" fill="#1E293B" stroke="#3B4D66"/>
    <text x="268" y="246" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="13" fill="#F4F7FB">Spacing · Type · Motion</text>
    <text x="268" y="268" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12" fill="#8BA0B8">8pt grid · WCAG AA</text>
  </g>
</svg>
